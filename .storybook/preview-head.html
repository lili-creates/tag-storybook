<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<!-- Iconos Phosphor desde la CDN (regular) -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"
/>

<!-- Tema antes del primer render: en docs el iframe se recarga al cambiar de modo y, sin esto, se ve un destello blanco -->
<script>
  (function () {
    try {
      var m = /[?&]globals=([^&]*)/.exec(location.search);
      var dark = !!m && /theme(:|%3A)dark/i.test(m[1]);
      // El tema elegido en la barra manda sobre la URL del iframe (que puede ir un paso por detrás al volver a claro)
      var saved = localStorage.getItem('tag-theme');
      if (saved) dark = saved === 'dark';
      var root = document.documentElement;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.style.background = dark ? '#222325' : '#ffffff';
      root.style.colorScheme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
<style>
  /* Pantallas de carga de Storybook: que hereden el fondo del tema en vez de ser blancas */
  html[data-theme='dark'] .sb-wrapper,
  html[data-theme='dark'] .sb-preparing-story,
  html[data-theme='dark'] .sb-preparing-docs,
  html[data-theme='dark'] .sb-nopreview {
    background: #222325;
  }
</style>
